<section class="top-bar" aria-label="Booking">
  <div class="top-bar-row">
    <p class="selected-date">{{ selectedLabel }}</p>
    <button type="button" class="book-button" [disabled]="busy || !selected" [attr.aria-busy]="busy" (click)="toggleBooking()">
      {{ isBooked ? 'Withdraw booking' : 'Book Now' }}
    </button>
  </div>
  <div class="top-bar-message" aria-live="polite">{{ error }}</div>
</section>
<div class="booking-layout">
  <div class="layout-calendar">
    <app-calendar [bookable]="bookable" [selected]="selected" [booked]="booked" (dateSelected)="select($event)" (dateDeselected)="deselect()" />
  </div>
  <div class="layout-plan">
    <app-desk-plan
      [desks]="desks"
      [availability]="availability"
      [selectedDesk]="selectedDesk"
      [yourDesk]="yourDesk"
      [signedIn]="signedIn"
      (deskSelected)="selectDesk($event)"
      (deskDeselected)="deselectDesk()"
    />
  </div>
</div>
