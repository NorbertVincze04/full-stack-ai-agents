<h2>Login</h2>

@if (registered) {
  <p class="form-success" role="status">Account created, please log in</p>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (errorMessage) {
    <p class="form-error" role="alert">{{ errorMessage }}</p>
  }

  <div class="field">
    <label for="login-email">Email</label>
    <input
      id="login-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="showError('email')"
      [attr.aria-describedby]="showError('email') ? 'login-email-error' : null"
    />
    @if (showError('email')) {
      <p class="field-error" id="login-email-error">Email is required</p>
    }
  </div>

  <div class="field">
    <label for="login-password">Password</label>
    <div class="password-wrap">
      <input
        id="login-password"
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="showError('password')"
        [attr.aria-describedby]="showError('password') ? 'login-password-error' : null"
      />
      <button
        type="button"
        class="password-toggle"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword"
        (click)="showPassword = !showPassword"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
          <circle cx="12" cy="12" r="3" />
          @if (showPassword) {
            <path d="M3 3l18 18" />
          }
        </svg>
      </button>
    </div>
    @if (showError('password')) {
      <p class="field-error" id="login-password-error">Password is required</p>
    }
  </div>

  <button type="submit" [disabled]="submitting" [attr.aria-busy]="submitting">
    {{ submitting ? 'Logging in...' : 'Login' }}
  </button>
</form>

<p class="alt-link">No account yet? <a routerLink="/register">Register</a></p>
