<h2>Login</h2>

@if (registered) {
  <p class="form-success" role="status">Account created, please log in</p>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (errorMessage) {
    <p class="form-error" role="alert">{{ errorMessage }}</p>
  }

  <div class="field">
    <label for="login-email">Email</label>
    <input
      id="login-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="showError('email')"
      [attr.aria-describedby]="showError('email') ? 'login-email-error' : null"
    />
    @if (showError('email')) {
      <p class="field-error" id="login-email-error">Email is required</p>
    }
  </div>

  <div class="field">
    <label for="login-password">Password</label>
    <input
      id="login-password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [attr.aria-invalid]="showError('password')"
      [attr.aria-describedby]="showError('password') ? 'login-password-error' : null"
    />
    @if (showError('password')) {
      <p class="field-error" id="login-password-error">Password is required</p>
    }
  </div>

  <button type="submit" [disabled]="submitting" [attr.aria-busy]="submitting">
    {{ submitting ? 'Logging in...' : 'Login' }}
  </button>
</form>

<p class="alt-link">No account yet? <a routerLink="/register">Register</a></p>
