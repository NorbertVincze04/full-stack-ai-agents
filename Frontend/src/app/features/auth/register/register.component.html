<h2>Register</h2>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (errorMessage) {
    <p class="form-error" role="alert">{{ errorMessage }}</p>
  }

  <div class="field">
    <label for="register-full-name">Full name</label>
    <input
      id="register-full-name"
      type="text"
      formControlName="fullName"
      autocomplete="name"
      [attr.aria-invalid]="errorFor('fullName') !== null"
      [attr.aria-describedby]="errorFor('fullName') ? 'register-full-name-error' : null"
    />
    @if (errorFor('fullName'); as msg) {
      <p class="field-error" id="register-full-name-error">{{ msg }}</p>
    }
  </div>

  <div class="field">
    <label for="register-email">Email</label>
    <input
      id="register-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="errorFor('email') !== null"
      [attr.aria-describedby]="errorFor('email') ? 'register-email-error' : null"
    />
    @if (errorFor('email'); as msg) {
      <p class="field-error" id="register-email-error">{{ msg }}</p>
    }
  </div>

  <div class="field">
    <label for="register-password">Password</label>
    <div class="password-wrap">
      <input
        id="register-password"
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-invalid]="errorFor('password') !== null"
        [attr.aria-describedby]="errorFor('password') ? 'register-password-error' : null"
      />
      <button
        type="button"
        class="password-toggle"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword"
        (click)="showPassword = !showPassword"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
          <circle cx="12" cy="12" r="3" />
          @if (showPassword) {
            <path d="M3 3l18 18" />
          }
        </svg>
      </button>
    </div>
    @if (errorFor('password'); as msg) {
      <p class="field-error" id="register-password-error">{{ msg }}</p>
    }
  </div>

  <div class="field">
    <label for="register-confirm-password">Confirm password</label>
    <div class="password-wrap">
      <input
        id="register-confirm-password"
        [type]="showConfirmPassword ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="errorFor('confirmPassword') !== null"
        [attr.aria-describedby]="errorFor('confirmPassword') ? 'register-confirm-password-error' : null"
      />
      <button
        type="button"
        class="password-toggle"
        [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showConfirmPassword"
        (click)="showConfirmPassword = !showConfirmPassword"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
          <circle cx="12" cy="12" r="3" />
          @if (showConfirmPassword) {
            <path d="M3 3l18 18" />
          }
        </svg>
      </button>
    </div>
    @if (errorFor('confirmPassword'); as msg) {
      <p class="field-error" id="register-confirm-password-error">{{ msg }}</p>
    }
  </div>

  <button type="submit" [disabled]="submitting" [attr.aria-busy]="submitting">
    {{ submitting ? 'Registering...' : 'Register' }}
  </button>
</form>

<p class="alt-link">Already have an account? <a routerLink="/login">Login</a></p>
