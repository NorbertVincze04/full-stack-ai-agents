name: CI - Frontend Test/Build

on:
  push:
    branches: [dev]
    paths: ["Frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["Frontend/**", ".github/workflows/ci-frontend.yml"]

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Frontend - test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security check (blocks on critical only)
        run: npm audit --omit=dev --audit-level=critical
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:ci

  container-image:
    name: Frontend - container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: docker build -f Frontend/Containerfile -t deskbooking-frontend:ci Frontend
