name: CI - PR Check

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: PR - title, branches and files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR merge commit is only inspected with git; nothing from it is executed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check branches, title and description
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs into main must come from dev (got $HEAD_REF)."
            fail=1
          fi
          if [ "$BASE_REF" = "dev" ] && { [ "$HEAD_REF" = "main" ] || [ "$HEAD_REF" = "dev" ]; }; then
            echo "::error::PRs into dev must come from a task branch (got $HEAD_REF)."
            fail=1
          fi
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*: [^ ].+'; then
            echo "::error::PR title must look like '<task-id>: <title>' (got: $PR_TITLE)."
            fail=1
          fi
          if [ "${#PR_BODY}" -lt 20 ]; then
            echo "::error::PR description is empty or too short."
            fail=1
          fi
          exit "$fail"
      - name: Check changed files
        run: |
          set -euo pipefail
          # HEAD is the merge commit of the PR; its first parent is the base branch.
          files=$(git diff --name-only HEAD^1 HEAD)
          bad=$(printf '%s\n' "$files" | grep -E '(^|/)\.env$|\.(pem|key|crt|cer|pfx|p12)$|^db-backups/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Files that must never be committed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
