name: CD - Merge dev into main

on:
  workflow_run:
    workflows: ["CI - Backend Test/Build", "CI - Frontend Test/Build"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-merge
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev')
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ready: ${{ steps.resolve.outputs.ready }}
    steps:
      - name: Resolve and validate the commit to promote
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_REF" != "refs/heads/dev" ]; then
              echo "::error::Manual runs must be dispatched from dev (got $DISPATCH_REF)."
              exit 1
            fi
            sha=$(gh api "repos/$REPO/git/ref/heads/dev" --jq .object.sha)
          else
            sha="$RUN_SHA"
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Resolved value is not a commit SHA."
            exit 1
          fi
          # Each area workflow must be green for this commit. An area whose CI was skipped by its
          # path filter counts as green only if its latest completed dev run succeeded and the area
          # has not changed since that run's commit.
          ready=true
          for entry in ci-backend.yml:Backend ci-frontend.yml:Frontend; do
            wf="${entry%%:*}"
            dir="${entry##*:}"
            runs="repos/$REPO/actions/workflows/$wf/runs"
            ok=$(gh api "$runs?head_sha=$sha&branch=dev&event=push&status=success" --jq .total_count)
            if [ "$ok" -ge 1 ]; then
              continue
            fi
            any=$(gh api "$runs?head_sha=$sha&branch=dev&event=push" --jq .total_count)
            if [ "$any" -ge 1 ]; then
              echo "::notice::$wf has not succeeded for $sha (running or failed)."
              ready=false
              continue
            fi
            base=$(gh api "$runs?branch=dev&event=push&status=completed&per_page=1" --jq '.workflow_runs[0] | select(.conclusion == "success") | .head_sha // empty')
            if [ -z "$base" ]; then
              echo "::notice::$wf was skipped for $sha and its latest completed dev run is missing or not green."
              ready=false
              continue
            fi
            diff=$(gh api "repos/$REPO/compare/$base...$sha" --jq "[.status, ([.files[].filename | select(startswith(\"$dir/\") or . == \".github/workflows/$wf\")] | length)] | @tsv")
            status=$(printf '%s' "$diff" | cut -f1)
            changed=$(printf '%s' "$diff" | cut -f2)
            if { [ "$status" != "ahead" ] && [ "$status" != "identical" ]; } || [ "$changed" -ne 0 ]; then
              echo "::notice::$wf has no run for $sha but $dir changed since the last green run ($base)."
              ready=false
            fi
          done
          if [ "$ready" = false ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::CI has not succeeded for the dev head ($sha). Not promoting."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "Commit to promote: $sha (ready=$ready)"

  merge:
    name: merge dev into main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    permissions:
      contents: write
    steps:
      # Credentials stay persisted: this is the only job that fetches and pushes with the token.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge the tested commit into main
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          if ! git merge-base --is-ancestor "$SHA" origin/dev; then
            echo "::error::$SHA is not reachable from origin/dev. Not promoting."
            exit 1
          fi
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "::notice::main already contains $short. Nothing to do."
            exit 0
          fi
          if ! git merge --no-ff "$SHA" -m "chore: merge dev into main (CI passed for $short)"; then
            git merge --abort || true
            echo "::error::Merge conflict merging $short into main. Resolve manually; nothing was pushed."
            exit 1
          fi
          git push origin HEAD:refs/heads/main

  cleanup:
    name: delete merged task branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, merge]
    if: needs.merge.result == 'success'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Delete task branches whose PR is merged and now in main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls?state=closed&base=dev&per_page=100" \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == "'"$REPO"'" and (.head.ref | startswith("task/"))) | [.head.ref, .merge_commit_sha] | @tsv' |
          while IFS=$'\t' read -r ref sha; do
            if ! printf '%s' "$ref" | grep -Eq '^task/[A-Za-z0-9._-]+$'; then
              continue
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main 2>/dev/null; then
              echo "::notice::$ref is merged into dev but not yet in main. Keeping it."
              continue
            fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" >/dev/null 2>&1; then
              echo "Deleted $ref"
            fi
          done
