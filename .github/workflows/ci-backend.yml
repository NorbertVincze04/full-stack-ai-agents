name: CI - Backend Test/Build

on:
  push:
    branches: [dev]
    paths: ["Backend/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["Backend/**", ".github/workflows/ci-backend.yml"]

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Backend - test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security check (blocks on critical only)
        run: npm audit --omit=dev --audit-level=critical
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  container-image:
    name: Backend - container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: docker build -f Backend/Containerfile -t deskbooking-backend:ci Backend
